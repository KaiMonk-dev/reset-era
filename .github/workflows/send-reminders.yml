name: send-reminders
on:
  schedule:
    - cron: "0 13 * * *" # 13:00 UTC daily — adjust once real signup times exist
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Call Supabase edge function
        run: |
          curl -sS -X POST "${{ secrets.SUPABASE_FUNCTION_URL }}" \
            -H "authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "content-type: application/json" \
            --fail-with-body --max-time 60
